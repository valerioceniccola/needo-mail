# Rilascio di una nuova versione di Needo.
# Parte a ogni push su main (e a mano da Actions › Release › Run workflow): se la versione in package.json
# non ha ancora una Release completa, costruisce l'app su un Mac di GitHub (chip Apple), la firma col
# certificato Developer ID, la notarizza e la pubblica come Release "vX.Y.Z" (l'etichetta la crea GitHub).
# Le app installate la vedono da sole (electron-updater). Configurazione dei segreti: docs/RELEASING.md
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# un rilascio alla volta: un push arrivato durante una pubblicazione aspetta che finisca
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # controllo veloce su Linux: c'è già una Release completa per questa versione?
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEFORE: ${{ github.event.before }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # su un push si rilascia solo se questo push ha cambiato la versione: le modifiche normali
          # su main non pubblicano niente (le versioni nuove si fanno solo quando si alza la versione)
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            PREV="$(git show "$BEFORE:package.json" 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version" 2>/dev/null || echo "")"
            if [ "$PREV" = "$VERSION" ]; then
              echo "Versione invariata ($VERSION): niente da rilasciare."
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          # a mano (Run workflow) si può ripubblicare una versione rimasta a metà, cioè senza .dmg
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null | grep -qx "Needo-$VERSION.dmg"; then
            echo "La versione $VERSION è già uscita: niente da fare."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Versione da pubblicare: $VERSION"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # l'icona .icon si compila con actool di Xcode 26 o successivo: si sceglie l'Xcode più recente sul Mac di GitHub
      - name: Xcode recente
        run: |
          XC="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XC"
          echo "Xcode: $XC"; xcrun actool --version | grep -A1 short-bundle-version | tail -1 || true

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx electron-vite build

      # Controlla i segreti e prepara il certificato, così un errore si legge subito nel riepilogo della run
      - name: Controllo segreti e certificato
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ok=true
          [ -n "$CSC_LINK" ] || { echo "::error::Manca il segreto MAC_CERT_P12_BASE64"; ok=false; }
          [ -n "$CSC_KEY_PASSWORD" ] || { echo "::error::Manca il segreto MAC_CERT_PASSWORD"; ok=false; }
          [ -n "$APPLE_ID" ] || { echo "::error::Manca il segreto APPLE_ID"; ok=false; }
          [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] || { echo "::error::Manca il segreto APPLE_APP_SPECIFIC_PASSWORD"; ok=false; }
          [ -n "$APPLE_TEAM_ID" ] || { echo "::error::Manca il segreto APPLE_TEAM_ID"; ok=false; }
          $ok || exit 1

          if ! printf '%s' "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/cert.p12" 2>/dev/null || [ ! -s "$RUNNER_TEMP/cert.p12" ]; then
            echo "::error::MAC_CERT_P12_BASE64 non è un base64 valido: rifallo con  base64 -i Needo.p12 | pbcopy"
            exit 1
          fi
          # portachiavi temporaneo con il certificato: electron-builder lo usa da qui (più affidabile di CSC_LINK)
          KC="$RUNNER_TEMP/needo.keychain-db"
          KP="$(uuidgen)"
          security create-keychain -p "$KP" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KP" "$KC"
          if ! security import "$RUNNER_TEMP/cert.p12" -k "$KC" -f pkcs12 -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild > /dev/null 2>&1; then
            echo "::error::Il file .p12 non si apre con MAC_CERT_PASSWORD: password sbagliata o file .p12 rovinato"
            exit 1
          fi
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KP" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          IDS="$(security find-identity -v -p codesigning "$KC")"
          NAME="$(echo "$IDS" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')"
          if [ -z "$NAME" ]; then
            echo "::error::Nel .p12 non c'è un certificato 'Developer ID Application' con la sua chiave privata. Trovato: $(echo "$IDS" | head -3 | tr '\n' ' ')"
            exit 1
          fi
          echo "::notice::Certificato ok: $NAME"
          echo "CSC_NAME=${NAME#Developer ID Application: }" >> "$GITHUB_ENV"
          echo "CSC_KEYCHAIN=$KC" >> "$GITHUB_ENV"

      - name: Build, firma, notarizzazione e pubblicazione
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          for attempt in 1 2; do
            if npx electron-builder --mac --publish always 2>&1 | tee "$RUNNER_TEMP/build.log"; then exit 0; fi
            echo "Tentativo $attempt non riuscito"
          done
          # righe utili come annotazioni separate: si leggono dal riepilogo della run senza aprire i log
          { grep -E "⨯|rror|failed|status code" "$RUNNER_TEMP/build.log" || tail -10 "$RUNNER_TEMP/build.log"; } | tail -9 | while IFS= read -r line; do
            echo "::error::$(echo "$line" | cut -c1-400)"
          done
          exit 1
