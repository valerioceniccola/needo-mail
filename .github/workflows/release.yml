# Rilascio di una nuova versione di Needo.
# Parte a ogni push su main (e a mano da Actions › Release › Run workflow): se la versione in package.json
# non ha ancora una Release, costruisce l'app su un Mac di GitHub (chip Apple), la firma col certificato
# Developer ID, la notarizza e la pubblica come Release "vX.Y.Z" (l'etichetta la crea GitHub).
# Le app installate la vedono da sole (electron-updater). Configurazione dei segreti: docs/RELEASING.md
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # controllo veloce su Linux: c'è già una Release per questa versione?
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "La versione $VERSION è già uscita: niente da fare."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Versione nuova: $VERSION"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx electron-vite build

      # Controlla i segreti prima della build, così un errore si legge subito nel riepilogo della run
      - name: Controllo segreti e certificato
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ok=true
          [ -n "$CSC_LINK" ] || { echo "::error::Manca il segreto MAC_CERT_P12_BASE64"; ok=false; }
          [ -n "$CSC_KEY_PASSWORD" ] || { echo "::error::Manca il segreto MAC_CERT_PASSWORD"; ok=false; }
          [ -n "$APPLE_ID" ] || { echo "::error::Manca il segreto APPLE_ID"; ok=false; }
          [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] || { echo "::error::Manca il segreto APPLE_APP_SPECIFIC_PASSWORD"; ok=false; }
          [ -n "$APPLE_TEAM_ID" ] || { echo "::error::Manca il segreto APPLE_TEAM_ID"; ok=false; }
          $ok || exit 1

          if ! printf '%s' "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/cert.p12" 2>/dev/null || [ ! -s "$RUNNER_TEMP/cert.p12" ]; then
            echo "::error::MAC_CERT_P12_BASE64 non è un base64 valido: rifallo con  base64 -i Needo.p12 | pbcopy"
            exit 1
          fi
          # portachiavi temporaneo con il certificato: electron-builder lo usa da qui (più affidabile di CSC_LINK)
          KC="$RUNNER_TEMP/needo.keychain-db"
          KP="$(uuidgen)"
          security create-keychain -p "$KP" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KP" "$KC"
          if ! security import "$RUNNER_TEMP/cert.p12" -k "$KC" -f pkcs12 -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild > /dev/null 2>&1; then
            echo "::error::Il file .p12 non si apre con MAC_CERT_PASSWORD: password sbagliata o file .p12 rovinato"
            exit 1
          fi
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KP" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          IDS="$(security find-identity -v -p codesigning "$KC")"
          NAME="$(echo "$IDS" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')"
          if [ -z "$NAME" ]; then
            echo "::error::Nel .p12 non c'è un certificato 'Developer ID Application' con la sua chiave privata. Trovato: $(echo "$IDS" | head -3 | tr '\n' ' ')"
            exit 1
          fi
          echo "::notice::Certificato ok: $NAME"
          echo "CSC_NAME=${NAME#Developer ID Application: }" >> "$GITHUB_ENV"
          echo "CSC_KEYCHAIN=$KC" >> "$GITHUB_ENV"

      - name: Build, firma, notarizzazione e pubblicazione
        run: |
          set -o pipefail
          if ! npx electron-builder --mac --publish always 2>&1 | tee "$RUNNER_TEMP/build.log"; then
            # le ultime righe come annotazione: si leggono dal riepilogo della run senza aprire i log
            msg="$(grep -E "⨯|Error|error:" "$RUNNER_TEMP/build.log" | tail -8 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            [ -n "$msg" ] || msg="$(tail -15 "$RUNNER_TEMP/build.log" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            echo "::error title=electron-builder::$msg"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
