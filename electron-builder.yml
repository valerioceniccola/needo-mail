appId: it.valerioceniccola.needo
productName: Needo
directories:
  buildResources: build
files:
  - out/**
  - package.json
  # modulo nativo per leggere lo stato delle notifiche (src/main/notificationStatus.ts)
  - native/notification-settings/build/Release/notification_settings.node
asarUnpack:
  - native/**/*.node
mac:
  target:
    # dmg per la prima installazione, zip per gli aggiornamenti automatici (electron-updater su macOS usa lo zip)
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  # icona in formato Icon Composer (.icon): macOS 26 la mostra come le icone di sistema, senza la cornice
  # grigia che mette attorno alle icone vecchie; da qui electron-builder genera anche l'.icns per i macOS precedenti
  icon: build/icon.icon
  category: public.app-category.productivity
  hardenedRuntime: true
  # firma con il certificato "Developer ID Application" presente nel Portachiavi
  # notarizzazione: impostare APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD e APPLE_TEAM_ID prima di npm run build:mac
  notarize: true
  extendInfo:
    # notifiche in stile "Avvisi": restano a schermo e mostrano i pulsanti Elimina / Apri
    NSUserNotificationAlertStyle: alert
dmg:
  artifactName: Needo-${version}.dmg
publish:
  provider: github
  owner: valerioceniccola
  repo: needo-mail
  # serve per scrivere latest-mac.yml (dove le app guardano se c'è una versione nuova); a caricare i file
  # e pubblicare la Release ci pensa il workflow con gh, tutto in una volta (.github/workflows/release.yml)
  releaseType: draft
