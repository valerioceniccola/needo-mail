appId: it.valerioceniccola.needo
productName: Needo
directories:
  buildResources: build
files:
  - out/**
  - package.json
mac:
  target:
    # dmg per la prima installazione, zip per gli aggiornamenti automatici (electron-updater su macOS usa lo zip)
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  category: public.app-category.productivity
  hardenedRuntime: true
  # firma con il certificato "Developer ID Application" presente nel Portachiavi
  # notarizzazione: impostare APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD e APPLE_TEAM_ID prima di npm run build:mac
  notarize: true
  extendInfo:
    # notifiche in stile "Avvisi": restano a schermo e mostrano i pulsanti Elimina / Apri
    NSUserNotificationAlertStyle: alert
dmg:
  artifactName: Needo-${version}.dmg
publish:
  provider: github
  owner: valerioceniccola
  repo: needo-mail
  # la release esce subito pubblicata: le app la vedono senza passaggi a mano
  releaseType: release
